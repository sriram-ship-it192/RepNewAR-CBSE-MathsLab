<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepNewAR • Classroom QA</title><style>body{font-family:Inter,Arial,sans-serif;background:#071426;color:#e2e8f0;margin:0;padding:28px}main{max-width:1000px;margin:auto}h1{color:#67e8f9}.card{background:#10213d;border:1px solid #284665;border-radius:16px;padding:18px;margin:14px 0}label{display:block;padding:9px 0}.lesson{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.muted{color:#94a3b8}.bar{position:sticky;top:10px;background:#0b1f33;border:1px solid #2c4c69;padding:14px;border-radius:12px}.progress{height:8px;background:#1e293b;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#22c55e}</style></head><body><main><h1>RepNewAR — Classroom QA</h1><p class="muted">Manual validation checklist for the 26 physical Maths Lab activities.</p><div class="bar"><b id="count">0 / 26 checked</b><div class="progress"><i id="fill"></i></div></div><section id="list"></section></main><script>const lessons=[{"id": "fraction_lab_3_5", "title": "Fraction Kit \u2014 Fractions", "category": "CBSE Maths Lab \u2022 Classes 3\u20135"}, {"id": "decimal_kit", "title": "Decimal Kit \u2014 Tenths & Hundredths", "category": "CBSE Maths Lab \u2022 Classes 3\u20135"}, {"id": "fake_money", "title": "Fake Money Kit \u2014 Counting & Change", "category": "CBSE Maths Lab \u2022 Classes 3\u20135"}, {"id": "rangometry", "title": "Rangometry Kit \u2014 Angles", "category": "CBSE Maths Lab \u2022 Classes 3\u20135"}, {"id": "training_clock", "title": "Training Clock \u2014 Time", "category": "CBSE Maths Lab \u2022 Classes 3\u20135"}, {"id": "sau_rang_khoj", "title": "Sau Rang Ki Khoj \u2014 Colour Patterns", "category": "CBSE Maths Lab \u2022 Classes 3\u20135"}, {"id": "tessellation", "title": "Tessellation Kit \u2014 Shapes & Patterns", "category": "CBSE Maths Lab \u2022 Classes 3\u20135"}, {"id": "dienes_blocks", "title": "Dienes Blocks \u2014 Place Value", "category": "CBSE Maths Lab \u2022 Classes 3\u20135"}, {"id": "place_value", "title": "Place Value / Number Cards", "category": "CBSE Maths Lab \u2022 Classes 3\u20135"}, {"id": "probability_6_8", "title": "Probability Kit \u2014 Experimental Probability", "category": "CBSE Maths Lab \u2022 Classes 6\u20138"}, {"id": "fraction_lab_6_8", "title": "Fraction Kit \u2014 Equivalent Fractions", "category": "CBSE Maths Lab \u2022 Classes 6\u20138"}, {"id": "triangle_6_8", "title": "Triangle Kit \u2014 Sides & Angles", "category": "CBSE Maths Lab \u2022 Classes 6\u20138"}, {"id": "integer_board", "title": "Integer Board \u2014 Addition & Subtraction", "category": "CBSE Maths Lab \u2022 Classes 6\u20138"}, {"id": "unit_cubes_6_8", "title": "Unit Cubes \u2014 Volume", "category": "CBSE Maths Lab \u2022 Classes 6\u20138"}, {"id": "geometry_box_6_8", "title": "Geometry Box \u2014 Constructions", "category": "CBSE Maths Lab \u2022 Classes 6\u20138"}, {"id": "geoboard", "title": "Geoboard & Rubber Bands \u2014 Area", "category": "CBSE Maths Lab \u2022 Classes 6\u20138"}, {"id": "graph_activity_6_8", "title": "Graph Paper & Activity Materials", "category": "CBSE Maths Lab \u2022 Classes 6\u20138"}, {"id": "probability_9_10", "title": "Probability Kit \u2014 Compound Events", "category": "CBSE Maths Lab \u2022 Classes 9\u201310"}, {"id": "mensuration", "title": "Mensuration Kit \u2014 Area & Volume", "category": "CBSE Maths Lab \u2022 Classes 9\u201310"}, {"id": "measuring_jug", "title": "Measuring Jug Set \u2014 Capacity", "category": "CBSE Maths Lab \u2022 Classes 9\u201310"}, {"id": "geometry_box_9_10", "title": "Geometry Box \u2014 Theorem & Construction", "category": "CBSE Maths Lab \u2022 Classes 9\u201310"}, {"id": "math_models_charts", "title": "Mathematical Models / Charts \u2014 Formula Explorer", "category": "CBSE Maths Lab \u2022 Classes 9\u201310"}, {"id": "graph_isometric", "title": "Graph & Isometric Sheets \u2014 3D Coordinates", "category": "CBSE Maths Lab \u2022 Classes 9\u201310"}, {"id": "dice_coins_cards", "title": "Dice, Coins & Playing Cards \u2014 Probability", "category": "CBSE Maths Lab \u2022 Classes 9\u201310"}, {"id": "conic_sections", "title": "Conic Section Models \u2014 Circle, Ellipse, Parabola", "category": "CBSE Maths Lab \u2022 Classes 9\u201310"}, {"id": "venn_diagrams", "title": "Venn Diagram Models / Charts \u2014 Sets", "category": "CBSE Maths Lab \u2022 Classes 9\u201310"}];for(const l of lessons){const key='qa:'+l.id;const row=document.createElement('div');row.className='card lesson';row.innerHTML=`<div><b>${l.title}</b><div class="muted">${l.category}</div></div><label><input type="checkbox" data-key="${key}"> Manual QA passed</label>`;const cb=row.querySelector('input');cb.checked=localStorage.getItem(key)==='1';cb.onchange=()=>{localStorage.setItem(key,cb.checked?'1':'0');update()};document.querySelector('#list').append(row)}function update(){const c=[...document.querySelectorAll('input')].filter(x=>x.checked).length;document.querySelector('#count').textContent=`${c} / ${lessons.length} checked`;document.querySelector('#fill').style.width=(c/lessons.length*100)+'%'}update();</script></body></html>
